# Geo-Distributed Read Replica Routing Configuration
#
# This router.conf documents the routing topology for the geo-distributed
# read replica deployment (issue #1051). The router itself performs
# blue/green upstream selection; read/write splitting is performed at the
# application level (see "Application-Level Routing" below), with the router
# providing the regional upstream pools that the application selects from.
#
# ---------------------------------------------------------------------------
# Replication Topology
# ---------------------------------------------------------------------------
#   Primary (read/write)   : us-east-1  -> blue_upstream / green_upstream
#   Read replica (US)      : us-east-1  -> replica_us_upstream
#   Read replica (EU)      : eu-west-1  -> replica_eu_upstream
#   Read replica (Asia)    : ap-southeast-1 -> replica_asia_upstream
#
#   Writes  -> primary only (never to a replica)
#   Reads   -> nearest healthy replica, falling back to primary
#
# ---------------------------------------------------------------------------
# Application-Level Routing
# ---------------------------------------------------------------------------
# The application determines the target region from the request context
# (client geo-IP / region header) and issues reads against the nearest
# replica pool, writes against the primary pool. The router exposes the
# pools below; the application picks the pool via the X-Read-Target header
# (us | eu | asia | primary). If the header is absent or the selected
# replica is unhealthy, the router falls back to the primary.
#
# Eventual consistency: reads served by replicas may lag the primary.
# The application must not read-after-write from a replica; after a write
# it should either read from the primary or wait for the replica lag
# threshold (see replica_lag_* below) to be satisfied.
#
# ---------------------------------------------------------------------------
# Failover
# ---------------------------------------------------------------------------
# If a replica fails its health check, it is removed from rotation and
# reads for that region fall back to the primary. If the primary fails,
# the router fails over to the standby primary (green_upstream) and
# replicas continue serving reads.

# --- Active deployment (blue/green) ---
active=blue
blue_upstream=http://127.0.0.1:3001
green_upstream=http://127.0.0.1:3002

# --- Primary (read/write) ---
# Writes are always routed here. Reads fall back here when no replica is
# healthy or when read-after-write consistency is required.
primary_upstream=http://127.0.0.1:3001
primary_standby_upstream=http://127.0.0.1:3002

# --- Geo-distributed read replicas ---
replica_us_upstream=http://127.0.0.1:3011
replica_eu_upstream=http://127.0.0.1:3012
replica_asia_upstream=http://127.0.0.1:3013

# Region -> replica pool mapping used for nearest-replica routing.
replica_region_us=us-east-1
replica_region_eu=eu-west-1
replica_region_asia=ap-southeast-1

# --- Read/write splitting ---
# write_target: pool that receives all write traffic.
write_target=primary_upstream
# read_target: default read pool when no region is specified.
read_target=replica_us_upstream
# read_fallback: pool used when the selected replica is unhealthy.
read_fallback=primary_upstream
# Header the application sets to select a read pool (us|eu|asia|primary).
read_target_header=X-Read-Target

# --- Replica lag monitoring ---
# Maximum acceptable replication lag (seconds) before a replica is
# considered stale and reads are diverted to the primary.
replica_lag_threshold_seconds=5
replica_lag_check_interval_seconds=10
replica_lag_metric=replication_lag_seconds
replica_lag_alert_threshold_seconds=30

# --- Health checks / failover ---
health_check_path=/healthz
health_check_interval_seconds=5
health_check_timeout_seconds=2
health_check_unhealthy_threshold=3
health_check_healthy_threshold=2
# On replica failure, remove from rotation and fall back to primary.
failover_on_replica_failure=true
# On primary failure, fail over to the standby primary.
failover_on_primary_failure=true
failover_primary_target=primary_standby_upstream