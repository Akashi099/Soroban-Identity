<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soroban Identity Verifier</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 16px;
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-warning {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .badge-success {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .expiring-alert {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: var(--warning);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .search-box {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 12px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .credential-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .credential-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
    }
    .cred-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .cred-id {
      font-family: monospace;
      font-size: 10px;
      color: var(--text-muted);
      word-break: break-all;
      margin-bottom: 6px;
    }
    .cred-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button.btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.btn-secondary:hover {
      background: #334155;
    }
    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      🛡️ Soroban Identity
    </div>
    <span id="cred-count-badge" class="badge badge-success">0 Stored</span>
  </div>

  <div id="expiring-alert" class="expiring-alert">
    ⚠️ <strong>Expiring Soon:</strong> <span id="expiring-text"></span>
  </div>

  <input type="text" id="search-input" class="search-box" placeholder="Search credentials by type, ID, or issuer...">

  <div id="credential-list" class="credential-list">
    <div class="empty-state">
      No credentials stored yet.<br>Sync from the Soroban Identity Web App.
    </div>
  </div>

  <div class="footer">
    <button id="autofill-btn" class="btn-secondary">Auto-fill Page</button>
    <button id="open-app-btn">Open Web App</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
