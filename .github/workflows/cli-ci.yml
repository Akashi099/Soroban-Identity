name: CLI CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'sdk/**'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'sdk/**'
      - '.github/workflows/cli-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: Build and test the CLI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The CLI imports @soroban-identity/sdk from its workspace, so the SDK has
      # to be built before the CLI can be type-checked or started.
      - name: Build the SDK
        run: npm run build:sdk

      - name: Type-check the CLI
        run: npm run type-check --workspace=cli

      - name: Build the CLI
        run: npm run build:cli

      - name: Test the CLI
        run: npm run test:cli

      # Proof for the "publish to npm" acceptance criterion: the tarball must
      # contain the build output, the binary entry point and the README.
      - name: Check the publishable tarball
        working-directory: cli
        run: |
          npm pack --dry-run
          node -e "
            const { execSync } = require('node:child_process');
            const out = execSync('npm pack --json --dry-run', { encoding: 'utf8' });
            const files = JSON.parse(out)[0].files.map((f) => f.path);
            for (const required of ['dist/index.js', 'package.json', 'README.md']) {
              if (!files.includes(required)) {
                throw new Error('missing from tarball: ' + required);
              }
            }
            const bin = require('./package.json').bin;
            if (!bin || bin['soroban-identity'] !== 'dist/index.js') {
              throw new Error('bin entry is not wired up');
            }
            console.log('tarball ok:', files.length, 'files');
          "
