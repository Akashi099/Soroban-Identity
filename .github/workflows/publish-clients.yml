name: Publish API Clients

on:
  workflow_dispatch:
  push:
    tags:
      - "clients-*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish-npm:
    name: Publish TypeScript client (npm)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/clients-ts-') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Build
        working-directory: tools/codegen/generated/typescript
        run: |
          npm install
          npm run build

      - name: Publish to npm
        working-directory: tools/codegen/generated/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-pypi:
    name: Publish Python client (PyPI)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/clients-py-') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        working-directory: tools/codegen/generated/python
        run: |
          pip install build twine
          python -m build

      - name: Publish to PyPI
        working-directory: tools/codegen/generated/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  publish-go:
    name: Publish Go client (module)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/clients-go-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Go client
        working-directory: tools/codegen/generated/go
        run: go build ./... && go vet ./...

      - name: Show module path for release
        working-directory: tools/codegen/generated/go
        run: go list -m