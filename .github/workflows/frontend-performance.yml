name: Frontend performance

on:
  pull_request:
    paths:
      - "frontend/**"
      - "sdk/**"
      - ".github/workflows/frontend-performance.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "sdk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Build, analyze, and enforce budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend and enforce budgets
        run: npm run build
        env:
          BUNDLE_MAX_INITIAL_KB: 750
          BUNDLE_MAX_TOTAL_JS_KB: 5000
          BUNDLE_MAX_TOTAL_ASSET_KB: 7000
      - name: Generate visual bundle report
        run: npm run analyze
      - name: Publish bundle metrics to job summary
        shell: bash
        run: |
          node -e 'const m=require("./dist/bundle-metrics.json"); console.log(`### Bundle metrics\n\n| Metric | Size | Budget |\n| --- | ---: | ---: |\n| Initial JavaScript | ${(m.initialJavaScriptBytes/1024).toFixed(1)} KiB | ${m.budgets.initialJavaScriptKb} KiB |\n| Total JavaScript | ${(m.totalJavaScriptBytes/1024).toFixed(1)} KiB | ${m.budgets.totalJavaScriptKb} KiB |\n| Total assets | ${(m.totalAssetBytes/1024).toFixed(1)} KiB | ${m.budgets.totalAssetKb} KiB |' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance-${{ github.sha }}
          path: |
            frontend/dist/bundle-metrics.json
            frontend/dist/asset-compression-manifest.json
            frontend/dist/bundle-report.html
          if-no-files-found: error
          retention-days: 14
