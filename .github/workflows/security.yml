name: Security testing
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
  pull-requests: write
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev
      - name: Rust dependency audit
        uses: actions-rust-lang/audit@v1
        with: { working-directory: contracts }
  contract-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked
      - name: Audit smart-contract dependencies
        working-directory: contracts
        run: cargo audit --deny warnings
      - name: License and vulnerability policy
        working-directory: contracts
        run: cargo deny check advisories bans sources licenses
      - name: Contract tests
        working-directory: contracts
        run: cargo test --workspace
      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: contract-security-report, path: contracts/target, if-no-files-found: ignore }
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start server for DAST
        run: |
          npm ci --prefix server
          (PORT=3001 ADMIN_API_KEY=ci-test STELLAR_SECRET_KEY=SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX CREDENTIAL_CONTRACT_ID=CXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX node server/src/index.js > /tmp/server.log 2>&1 & echo $! > /tmp/server.pid)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3001/health && break || sleep 2; done
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://127.0.0.1:3001
          allow_issue_writing: false
          fail_action: true
          rules_file_name: .zap/rules.tsv
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: zap-security-report, path: report_html.html }
      - name: Stop server
        if: always()
        run: test ! -f /tmp/server.pid || kill "$(cat /tmp/server.pid)" || true
  summary:
    if: always()
    needs: [dependency-review, contract-scan, zap]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce severity threshold
        run: |
          echo "Security gate: HIGH and CRITICAL findings fail this workflow; MEDIUM and LOW findings are reported for remediation."
          for result in '${{ needs.dependency-review.result }}' '${{ needs.contract-scan.result }}' '${{ needs.zap.result }}'; do
            test "$result" = success || exit 1
          done
