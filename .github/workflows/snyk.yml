name: Snyk

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *" # monthly security audit report

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk test (all projects)
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
      - name: Monthly audit report
        if: always() && github.event_name == 'schedule'
        run: snyk test --all-projects --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'schedule'
        with:
          name: snyk-monthly-report
          path: snyk-report.json
      - name: Notify Slack on critical vulnerabilities
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: Snyk found high/critical vulnerabilities in ${GITHUB_REPOSITORY} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\"}" \
            "$SLACK_WEBHOOK_URL"
