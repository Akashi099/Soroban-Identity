name: API Docs

on:
  pull_request:
    paths: ["docs/openapi.yaml", "server/openapi.json", "server/src/schemas/**", "docs/api/**"]
  push:
    branches: [main]
    paths: ["docs/openapi.yaml", "server/openapi.json", "server/src/schemas/**", "docs/api/**"]

jobs:
  docs-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint OpenAPI specs
        run: |
          npx --yes @redocly/cli@1 lint docs/openapi.yaml --skip-rule=operation-4xx-response
          npx --yes @redocly/cli@1 lint server/openapi.json --skip-rule=operation-4xx-response
