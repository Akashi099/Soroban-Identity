name: Infrastructure
on:
  pull_request:
    paths: ['infra/terraform/**']
  push:
    branches: [main]
    paths: ['infra/terraform/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Init without backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate
      - name: IaC security scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Infracost estimate
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v0.17
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: infra/terraform
          behavior: update
  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: terraform-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Plan each environment
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          for env in dev staging production; do
            terraform -chdir=infra/terraform/environments/$env init -input=false \
              -backend-config=bucket="$TF_STATE_BUCKET" \
              -backend-config=key="soroban-identity/$env.tfstate" \
              -backend-config=region="$AWS_REGION" \
              -backend-config=dynamodb_table="$TF_LOCK_TABLE" \
              -backend-config=encrypt=true
            terraform -chdir=infra/terraform/environments/$env plan -input=false -lock=true -out="$env.tfplan"
          done
