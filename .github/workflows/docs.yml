name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'sdk/src/**', 'contracts/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'sdk/src/**', 'contracts/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run docs:api --prefix docs
      - run: npm run build --prefix docs
      - name: Build Rust documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --manifest-path contracts/Cargo.toml

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
