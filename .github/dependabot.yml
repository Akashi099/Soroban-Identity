version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, frontend]
    groups:
      react: { patterns: ["react", "react-dom", "@types/react*"] }
      stellar: { patterns: ["@stellar/*", "@creit.tech/*"] }
      testing: { patterns: ["vitest", "@testing-library/*", "@axe-core/*", "axe-core"] }
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/server"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, server]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/sdk"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, sdk]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/docs"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docs]
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: "/contracts"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, rust]
    groups:
      soroban: { patterns: ["soroban-*", "stellar-*"] }
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, ci]
    groups:
      actions: { patterns: ["*"] }
