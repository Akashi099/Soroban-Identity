apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: soroban-identity
  labels:
    app: soroban-identity
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: soroban-identity
  template:
    metadata:
      labels:
        app: soroban-identity
    spec:
      # Longer than the server's graceful shutdown timeout (30 s by default).
      terminationGracePeriodSeconds: 35
      containers:
        - name: server
          image: ghcr.io/el-chapo-npm/soroban-identity:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 3001
          # Probe semantics: docs/container-health-checks.md (#883).
          # Startup: holds off the other probes until the process first
          # answers, allowing up to 30 x 2 s = 60 s for boot.
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          # Readiness: /ready checks the dependencies a request needs
          # (storage, Soroban RPC) and takes the pod out of the Service while
          # they are down, without restarting it.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: /live never touches a dependency, so only a hung or
          # crashed process gets restarted, not a pod whose RPC is down.
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: soroban-identity-secrets
  strategy:
    canary:
      canaryService: soroban-identity-canary
      stableService: soroban-identity-stable
      trafficRouting:
        nginx:
          stableIngress: soroban-identity
      steps:
        - setWeight: 10
        - pause:
            duration: ${CANARY_DURATION_HOURS}h
        - analysis:
            templates:
              - templateName: soroban-identity-canary-health
            args:
              - name: service-name
                value: soroban-identity-canary
        - setWeight: 50
        - pause:
            duration: 15m
        - analysis:
            templates:
              - templateName: soroban-identity-canary-health
        - setWeight: 100
      analysis:
        successfulRunHistoryLimit: 3
        unsuccessfulRunHistoryLimit: 5
---
apiVersion: v1
kind: Service
metadata:
  name: soroban-identity-stable
  labels:
    app: soroban-identity
spec:
  selector:
    app: soroban-identity
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: soroban-identity-canary
  labels:
    app: soroban-identity
spec:
  selector:
    app: soroban-identity
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soroban-identity
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.soroban-identity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soroban-identity-stable
                port:
                  name: http
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: soroban-identity-canary-health
spec:
  args:
    - name: service-name
      value: soroban-identity-canary
  metrics:
    - name: readiness
      interval: 30s
      count: 5
      successCondition: result == "healthy"
      failureLimit: 1
      provider:
        web:
          url: http://{{args.service-name}}:3001/health
          timeoutSeconds: 5
          jsonPath: "$.status"
    - name: error-rate
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: result[0] < 0.02
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{service="{{args.service-name}}"}[5m])), 1)
    - name: latency-p95
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: result[0] < 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[5m])) by (le))
