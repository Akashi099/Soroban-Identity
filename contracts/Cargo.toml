[package]
name = "soroban-identity-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
    ".",
    "shared-errors",
    "shared-events",
    "identity-registry",
    "credential-manager",
    "reputation",
    "governance",
    "soroban-identity-interface",
    "schema-registry",
    "revocation-registry",
    "selective-disclosure",
    "bridge",
]
default-members = [
    ".",
    "shared-errors",
    "shared-events",
    "identity-registry",
    "credential-manager",
    "reputation",
    "governance",
    "soroban-identity-interface",
    "schema-registry",
    "revocation-registry",
    "selective-disclosure",
    "bridge",
]
resolver = "2"

[dev-dependencies]
credential-manager = { path = "credential-manager", features = ["testutils"] }
identity-registry = { path = "identity-registry", features = ["testutils"] }
reputation = { path = "reputation", features = ["testutils"] }
governance = { path = "governance" }
shared-errors = { path = "shared-errors" }
shared-events = { path = "shared-events" }
soroban-identity-interface = { path = "soroban-identity-interface" }
schema-registry = { path = "schema-registry" }
revocation-registry = { path = "revocation-registry" }
selective-disclosure = { path = "selective-disclosure" }
did-bridge = { path = "bridge", features = ["testutils"] }
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# #949: strip symbols and debug info so less WASM is uploaded on deployment.
debug = 0
debug-assertions = false
strip = "symbols"
