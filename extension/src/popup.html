<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soroban Identity</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      width: 320px;
      background: #0f1117;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #2563eb;
      color: #fff;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover {
      background: #334155;
    }
    button.primary {
      background: #2563eb;
      color: white;
      border-color: #3b82f6;
    }
    button.primary:hover {
      background: #1d4ed8;
    }
    #expiry-warning {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #ca8a04;
      color: #fef08a;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 10px;
      display: none;
    }
    #status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .status-success { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .status-info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    #credential-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #empty-state {
      text-align: center;
      padding: 24px 12px;
      color: #64748b;
      font-size: 12px;
    }
    footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>🛡️</span> Soroban Identity
      <span id="credential-count" class="badge">0</span>
    </h1>
    <div class="actions">
      <button id="refresh-button" title="Refresh">↻</button>
      <button id="sync-button" class="primary" title="Sync Credentials">Sync</button>
    </div>
  </header>

  <div id="status" hidden></div>
  <div id="expiry-warning"></div>

  <ul id="credential-list"></ul>
  <div id="empty-state">No credentials stored locally.</div>

  <footer>
    <a href="#" id="open-sync-link">Settings / Sync</a>
    <span style="color: #64748b;">v0.1.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
