openapi: 3.0.3
info:
  title: Soroban-Identity API
  description: |
    REST-style API contract for the Soroban-Identity protocol, covering the
    identity-registry, credential-manager, and reputation contracts plus
    their SDK-level operations.

    Each operation is annotated with `x-soroban-contract` so consumers can map
    HTTP endpoints to the underlying Soroban contract function they invoke. This
    file is the single source of truth for the SDK's public surface and can be
    fed into `openapi-typescript` to regenerate `sdk/src/types.ts` types.
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: http://localhost:3030
    description: Local dev server (run with `node scripts/serve-openapi.mjs`)
tags:
  - name: identity
    description: Decentralised identifier (DID) registry operations
  - name: credentials
    description: Verifiable credential issuance, revocation, and lookup
  - name: reputation
    description: Reporter-submitted scores and anti-sybil checks
  - name: meta
    description: Spec discovery and health
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /openapi.yaml:
    get:
      tags: [meta]
      summary: Return this OpenAPI specification.
      responses:
        '200':
          description: The OpenAPI spec.
          content:
            application/yaml:
              schema:
                type: string
  /info:
    get:
      tags: [meta]
      summary: Server capability discovery.
      description: |
        Returns server version, supported features, and the minimum compatible
        SDK version. Clients can use this to gate feature usage before calling
        endpoints that may not exist on older deployments.
      responses:
        '200':
          description: Server information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '404':
          description: Endpoint not supported by this server version.

  /health:
    get:
      tags: [meta]
      summary: Liveness probe.
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /identity/dids:
    get:
      tags: [identity]
      summary: List all registered DID documents (offset-paginated).
      x-soroban-contract:
        contract: identity-registry
        function: list_dids
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 }, description: 1-based page number. }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 100 }, description: Records per page, capped at 100 server-side. }
      responses:
        '200':
          description: Page of DID documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dids:
                    type: array
                    items: { $ref: '#/components/schemas/DidDocument' }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
    post:
      tags: [identity]
      summary: Create a new DID.
      description: |
        Sensitive operation. Replay protection applies: clients must send a
        unique `X-Nonce` header per request. The server echoes the accepted
        nonce back in the `X-Nonce` response header and rejects duplicates
        with `409 REPLAY_DETECTED`. Used nonces are retained for 5 minutes.
      x-soroban-contract:
        contract: identity-registry
        function: create_did
      parameters:
        - $ref: '#/components/parameters/XNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controller]
              properties:
                controller:
                  type: string
                  description: Stellar address that will own the DID.
                metadata:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: DID created.
          headers:
            X-Nonce:
              $ref: '#/components/headers/XNonce'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      did: { type: string, example: 'did:stellar:GABC...' }
                      estimatedFee: { type: integer }
                      estimatedFeeXlm: { type: string }
                  txHash:
                    type: string
                    description: On-chain transaction hash for auditing (#296).
        '400':
          description: A DID already exists for this controller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          $ref: '#/components/responses/ReplayDetected'

  /identity/dids/{controller}:
    parameters:
      - { in: path, name: controller, required: true, schema: { type: string } }
    get:
      tags: [identity]
      summary: Resolve a DID document.
      x-soroban-contract:
        contract: identity-registry
        function: resolve_did
      responses:
        '200':
          description: Resolved DID document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DidDocument' }
        '404':
          description: No DID exists for `controller`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [identity]
      summary: Update DID metadata.
      description: |
        Sensitive operation. Replay protection applies: clients must send a
        unique `X-Nonce` header per request. Duplicate nonces are rejected
        with `409 REPLAY_DETECTED`; used nonces are retained for 5 minutes.
      x-soroban-contract:
        contract: identity-registry
        function: update_did
      parameters:
        - $ref: '#/components/parameters/XNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metadata]
              properties:
                metadata:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Updated.
          headers:
            X-Nonce:
              $ref: '#/components/headers/XNonce'
          content:
            application/json:
              schema:
                type: object
                properties:
                  txHash:
                    type: string
                    description: On-chain transaction hash for auditing (#296).
        '404':
          description: No DID exists for `controller`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Caller is not the DID controller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          $ref: '#/components/responses/ReplayDetected'
    delete:
      tags: [identity]
      summary: Deactivate a DID.
      description: |
        Sensitive operation. Replay protection applies: clients must send a
        unique `X-Nonce` header per request. Duplicate nonces are rejected
        with `409 REPLAY_DETECTED`; used nonces are retained for 5 minutes.
      x-soroban-contract:
        contract: identity-registry
        function: deactivate_did
      parameters:
        - $ref: '#/components/parameters/XNonce'
      responses:
        '200':
          description: Deactivated.
          headers:
            X-Nonce:
              $ref: '#/components/headers/XNonce'
          content:
            application/json:
              schema:
                type: object
                properties:
                  txHash:
                    type: string
                    description: On-chain transaction hash for auditing (#296).
        '404':
          description: No active DID for `controller`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          $ref: '#/components/responses/ReplayDetected'

  /identity/dids/{controller}/active:
    get:
      tags: [identity]
      summary: Check whether a controller has an active DID.
      x-soroban-contract:
        contract: identity-registry
        function: has_active_did
      parameters:
        - { in: path, name: controller, required: true, schema: { type: string } }
      responses:
        '200':
          description: Active-status check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }

  /credentials:
    post:
      tags: [credentials]
      summary: Issue a verifiable credential.
      description: |
        Sensitive operation. Replay protection applies: clients must send a
        unique `X-Nonce` header per request. Duplicate nonces are rejected
        with `409 REPLAY_DETECTED`; used nonces are retained for 5 minutes.
      x-soroban-contract:
        contract: credential-manager
        function: issue_credential
      parameters:
        - $ref: '#/components/parameters/XNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, subject, credentialType, claimsHash]
              properties:
                issuer: { type: string }
                subject: { type: string }
                credentialType: { $ref: '#/components/schemas/CredentialType' }
                claims:
                  type: object
                  additionalProperties: { type: string }
                claimsHash:
                  type: string
                  pattern: '^[0-9a-fA-F]{64}$'
                  description: 64-char hex (32 bytes) SHA-256 of the off-chain claims.
                signature:
                  type: string
                  pattern: '^[0-9a-fA-F]{128}$'
                expiresAt:
                  type: integer
                  description: Unix timestamp. 0 = no expiry.
                nonce:
                  type: string
                  description: |
                    Optional idempotency key (#295). When provided, the nonce is
                    mixed into the credential ID derivation so retrying with the
                    same nonce is a no-op if the credential already exists.
                schemaId:
                  type: string
                  format: uri
                  description: |
                    Optional URI of a JSON Schema to validate `claims` against
                    before submission (#298). Throws `ClaimsValidationError`
                    with field-level detail on failure.
      responses:
        '201':
          description: Credential issued.
          headers:
            X-Nonce:
              $ref: '#/components/headers/XNonce'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      credentialId: { type: string }
                      estimatedFee: { type: integer }
                      estimatedFeeXlm: { type: string }
                  txHash:
                    type: string
                    description: On-chain transaction hash for auditing (#296).
        '400':
          description: Malformed claims hash, signature, or claims failed schema validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Issuer is not registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Caller does not have permission to issue credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            A credential with the given ID already exists, or the request was
            rejected as a replay (`REPLAY_DETECTED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                credentialAlreadyExists:
                  value:
                    code: CREDENTIAL_ALREADY_EXISTS
                    message: Credential with ID "abc123" already exists.
                    details:
                      - field: id
                        value: abc123
                replayDetected:
                  value:
                    code: REPLAY_DETECTED
                    message: Nonce has already been used.
                    details:
                      - field: nonce
                        value: 9f8c1e2b4a
        '422':
          description: Credential data failed validation (e.g. claimsHash format is invalid).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /credentials/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string }, description: Hex-encoded 32-byte credential ID. }
    get:
      tags: [credentials]
      summary: Get a credential by ID.
      x-soroban-contract:
        contract: credential-manager
        function: get_credential
      responses:
        '200':
          description: The credential record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404':
          description: No credential with this ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [credentials]
      summary: Revoke a credential.
      description: |
        Sensitive operation. Replay protection applies: clients must send a
        unique `X-Nonce` header per request. Duplicate nonces are rejected
        with `409 REPLAY_DETECTED`; used nonces are retained for 5 minutes.
      x-soroban-contract:
        contract: credential-manager
        function: revoke_credential
      parameters:
        - $ref: '#/components/parameters/XNonce'
      responses:
        '204':
          description: Revoked.
          headers:
            X-Nonce:
              $ref: '#/components/headers/XNonce'
        '409':
          $ref: '#/components/responses/ReplayDetected'

  /credentials/{id}/verify:
    post:
      tags: [credentials]
      summary: Verify a credential and return its full record on success.
      description: |
        Verifies the credential identified by `id`. On success returns the
        full credential record alongside `verified: true`, eliminating the
        need for a follow-up GET /credentials/{id} call. On failure returns
        `verified: false` with a `reason` string describing why verification
        failed.
      x-soroban-contract:
        contract: credential-manager
        function: verify_credential
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [verified, credential]
                    properties:
                      verified:
                        type: boolean
                        enum: [true]
                      credential:
                        $ref: '#/components/schemas/Credential'
                  - type: object
                    required: [verified, reason]
                    properties:
                      verified:
                        type: boolean
                        enum: [false]
                      reason:
                        type: string
                        enum: [not_found, revoked, expired]
                        description: Machine-readable failure reason.

  /credentials/verify/batch:
    post:
      tags: [credentials]
      summary: Verify multiple credentials in a single batch request.
      description: |
        Verifies up to 50 credentials in a single request for efficiency.
        Supports partial success handling, returning verification results
        for each supplied credential ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                  description: Array of hex-encoded 32-byte credential IDs (max 50).
            example:
              ids:
                - "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
                - "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
      responses:
        '200':
          description: Batch verification results.
          content:
            application/json:
              schema:
                type: object
                required: [results, total, verifiedCount]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, verified]
                      properties:
                        id:
                          type: string
                        verified:
                          type: boolean
                        reason:
                          type: string
                          enum: [not_found, revoked, expired, invalid_id]
                        credential:
                          $ref: '#/components/schemas/Credential'
                  total:
                    type: integer
                    description: Total number of credentials checked.
                  verifiedCount:
                    type: integer
                    description: Total number of credentials successfully verified.
        '400':
          description: Invalid request payload or batch size exceeds 50.
        '401':
          description: Unauthorized.
        '413':
          description: Payload too large.
        '415':
          description: Unsupported media type.

  /credentials/{id}/expiry-reminder/snooze:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [credentials]
      summary: Snooze expiry reminder notifications for a credential.
      description: |
        Snoozes automated expiry reminder webhook dispatches for the specified number of days or until a target date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  default: 7
                  description: Number of days to snooze notifications.
                until:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp until which reminders should be snoozed.
      responses:
        '200':
          description: Expiry reminder snoozed.
          content:
            application/json:
              schema:
                type: object
                required: [success, credentialId, snoozedUntil]
                properties:
                  success: { type: boolean }
                  credentialId: { type: string }
                  snoozedUntil: { type: string, format: date-time }
        '404':
          description: Credential not found.

  /credentials/{id}/expiry-reminder/dismiss:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [credentials]
      summary: Dismiss expiry reminder notifications for a credential.
      description: |
        Permanently dismisses future expiry reminder webhook dispatches for this credential.
      responses:
        '200':
          description: Expiry reminder dismissed.
          content:
            application/json:
              schema:
                type: object
                required: [success, credentialId, dismissed]
                properties:
                  success: { type: boolean }
                  credentialId: { type: string }
                  dismissed: { type: boolean }
        '404':
          description: Credential not found.

  /admin/expiry-thresholds:
    get:
      tags: [admin]
      summary: Get current expiry reminder notification thresholds.
      responses:
        '200':
          description: Active reminder thresholds.
          content:
            application/json:
              schema:
                type: object
                required: [thresholds, warningDays]
                properties:
                  thresholds:
                    type: array
                    items: { type: integer }
                    example: [30, 7, 1]
                  warningDays: { type: integer }
    post:
      tags: [admin]
      summary: Update expiry reminder notification thresholds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thresholds]
              properties:
                thresholds:
                  type: array
                  items: { type: integer }
                  example: [30, 14, 7, 1]
      responses:
        '200':
          description: Thresholds updated.
          content:
            application/json:
              schema:
                type: object
                required: [success, thresholds]
                properties:
                  success: { type: boolean }
                  thresholds:
                    type: array
                    items: { type: integer }

  /admin/api-keys:
    post:
      tags: [admin]
      summary: Issue a new API key with configurable permissions and tier.
      description: |
        Generates a secure API key with configured scopes, tier, and expiration.
        The plaintext API key is returned ONCE and cannot be retrieved later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: backend-service
                owner:
                  type: string
                  example: alice
                scopes:
                  type: array
                  items:
                    type: string
                  example: [credentials:read, credentials:write]
                tier:
                  type: string
                  enum: [free, pro, enterprise]
                  default: free
                expiresInDays:
                  type: integer
                  example: 90
      responses:
        '201':
          description: API key issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '401':
          description: Unauthorized.
        '403':
          description: Insufficient permissions.

    get:
      tags: [admin]
      summary: List all API keys.
      description: |
        Returns metadata for all issued API keys (hashed keys excluded).
      responses:
        '200':
          description: List of API keys.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyMetadata'

  /admin/api-keys/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: Get metadata for a specific API key.
      responses:
        '200':
          description: API key metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyMetadata'
        '404':
          description: API key not found.
    delete:
      tags: [admin]
      summary: Revoke an API key.
      responses:
        '200':
          description: API key revoked.
          content:
            application/json:
              schema:
                type: object
                required: [success, id, status]
                properties:
                  success: { type: boolean }
                  id: { type: string }
                  status: { type: string, example: revoked }
        '404':
          description: API key not found.

  /admin/api-keys/{id}/rotate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: Rotate an API key.
      description: |
        Generates a new secret for an existing key and immediately revokes the old secret.
        Returns the new plaintext secret once.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  example: 90
      responses:
        '200':
          description: API key rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '404':
          description: API key not found.

  /credentials/by-subject/{subject}:
    parameters:
      - { in: path, name: subject, required: true, schema: { type: string } }
      - { in: query, name: cursor, schema: { type: integer, format: int64 }, description: Resume index from a prior page. }
      - { in: query, name: limit, schema: { type: integer, default: 0, maximum: 100 }, description: Page size; 0 → cap (100). }
      - { in: query, name: credentialType, schema: { $ref: '#/components/schemas/CredentialType' }, description: 'Optional filter — issue #251.' }
    get:
      tags: [credentials]
      summary: List credentials issued to a subject (cursor-paginated, optionally filtered).
      x-soroban-contract:
        contract: credential-manager
        function: list_subject_credentials
      responses:
        '200':
          description: One page of credential IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialIdsPage' }

  /credentials/issuers:
    parameters:
      - { in: query, name: cursor, schema: { type: integer, format: int64 } }
      - { in: query, name: limit, schema: { type: integer, default: 0, maximum: 100 } }
    get:
      tags: [credentials]
      summary: List registered issuers (cursor-paginated).
      x-soroban-contract:
        contract: credential-manager
        function: list_issuers
      responses:
        '200':
          description: One page of issuer addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesPage' }

  /reputation/{subject}:
    get:
      tags: [reputation]
      summary: Get the aggregate reputation record for a subject.
      x-soroban-contract:
        contract: reputation
        function: get_reputation
      parameters:
        - { in: path, name: subject, required: true, schema: { type: string } }
      responses:
        '200':
          description: Aggregate record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReputationRecord' }

  /reputation/{subject}/sybil-check:
    get:
      tags: [reputation]
      summary: Run the stored-default sybil check for a subject.
      x-soroban-contract:
        contract: reputation
        function: passes_sybil_check_default
      parameters:
        - { in: path, name: subject, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pass/fail result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  passes: { type: boolean }

  /reputation/{subject}/history:
    parameters:
      - { in: path, name: subject, required: true, schema: { type: string } }
      - { in: query, name: reporter, required: true, schema: { type: string } }
      - { in: query, name: cursor, schema: { type: integer, format: int64 } }
      - { in: query, name: limit, schema: { type: integer, default: 0, maximum: 100 } }
    get:
      tags: [reputation]
      summary: List a subject's score history from a specific reporter (cursor-paginated).
      x-soroban-contract:
        contract: reputation
        function: list_history
      responses:
        '200':
          description: One page of score entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreEntriesPage' }
        '404':
          description: Reporter is not registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reputation/reporters:
    parameters:
      - { in: query, name: cursor, schema: { type: integer, format: int64 } }
      - { in: query, name: limit, schema: { type: integer, default: 0, maximum: 100 } }
    get:
      tags: [reputation]
      summary: List registered reporters (cursor-paginated).
      x-soroban-contract:
        contract: reputation
        function: list_reporters
      responses:
        '200':
          description: One page of reporter addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesPage' }

  /reputation/scores:
    post:
      tags: [reputation]
      summary: Submit a score delta. Caller must be a registered reporter.
      description: |
        Sensitive operation. Replay protection applies: clients must send a
        unique `X-Nonce` header per request. Duplicate nonces are rejected
        with `409 REPLAY_DETECTED`; used nonces are retained for 5 minutes.
      x-soroban-contract:
        contract: reputation
        function: submit_score
      parameters:
        - $ref: '#/components/parameters/XNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporter, subject, delta, reason]
              properties:
                reporter: { type: string }
                subject: { type: string }
                delta: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        '201':
          description: Score submitted.
          headers:
            X-Nonce:
              $ref: '#/components/headers/XNonce'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      estimatedFee: { type: integer }
                      estimatedFeeXlm: { type: string }
                  txHash:
                    type: string
                    description: On-chain transaction hash for auditing (#296).
        '401':
          description: Reporter is not registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          $ref: '#/components/responses/ReplayDetected'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  parameters:
    XNonce:
      name: X-Nonce
      in: header
      required: true
      description: |
        Client-generated unique nonce for replay protection (#1052). Must be
        unique per request; the server stores used nonces in Redis for 5
        minutes and rejects duplicates with `409 REPLAY_DETECTED`. Recommended
        format: a UUIDv4 or 128-bit random hex string.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        example: 9f8c1e2b4a7d4f0e8c3b2a1d6e5f4c3b
  headers:
    XNonce:
      description: |
        The nonce accepted for this request, echoed back so clients can
        correlate responses with the request that produced them (#1052).
      schema:
        type: string
        example: 9f8c1e2b4a7d4f0e8c3b2a1d6e5f4c3b
  responses:
    ReplayDetected:
      description: |
        The supplied `X-Nonce` has already been used within the 5-minute
        replay window. The request was rejected without side effects.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: REPLAY_DETECTED
            message: Nonce has already been used.
            details:
              - field: nonce
                value: 9f8c1e2b4a
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication via X-API-Key header.
    BearerAuth:
      type: http
      scheme: bearer
      description: API Key authentication via Authorization Bearer header.
  schemas:
    ServerInfo:
      type: object
      required: [version, features, minSdkVersion]
      properties:
        version:
          type: string
          description: Server application version.
          example: 0.1.0
        features:
          type: array
          items: { type: string }
          description: List of optional features supported by this server.
          example: [webhook_delivery, batch_issuance, event_polling]
        minSdkVersion:
          type: string
          description: Minimum SDK version compatible with this server.
          example: 0.1.0
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [NOT_FOUND, UNAUTHORIZED, NETWORK_ERROR, VALIDATION_ERROR, CONTRACT_ERROR, INVALID_INPUT, UNKNOWN, REPLAY_DETECTED]
    ErrorResponse:
      type: object
      required: [code, message]
      description: Standard error envelope returned by all failing endpoints.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: REPLAY_DETECTED
        message:
          type: string
          description: Human-readable error description.
        details:
          type: array
          description: Optional field-level error detail.
          items:
            type: object
            properties:
              field: { type: string }
              value: {}
    ClaimsValidationError:
      type: object
      required: [error, code, fieldErrors]
      description: Thrown when claims fail JSON Schema validation (#298).
      properties:
        error: { type: string }
        code: { type: string, enum: [INVALID_INPUT] }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
          description: Per-field validation messages keyed by claim field path.
    CredentialType:
      type: string
      enum: [Kyc, Reputation, Achievement, Custom]
    DidDocument:
      type: object
      required: [id, controller, metadata, createdAt, updatedAt, active]
      properties:
        id: { type: string }
        controller: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        active: { type: boolean }
    Credential:
      type: object
      required: [id, subject, issuer, credentialType, claims, claimsHash, signature, issuedAt, expiresAt, revoked]
      properties:
        id: { type: string }
        subject: { type: string }
        issuer: { type: string }
        credentialType: { $ref: '#/components/schemas/CredentialType' }
        claims:
          type: object
          additionalProperties: { type: string }
        claimsHash: { type: string }
        signature: { type: string }
        issuedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        revoked: { type: boolean }
    VerifyResult:
      oneOf:
        - type: object
          required: [valid]
          properties:
            valid: { type: boolean, enum: [true] }
        - type: object
          required: [valid, reason]
          properties:
            valid: { type: boolean, enum: [false] }
            reason:
              type: string
              enum: [not_found, revoked, expired, unknown]
    ReputationRecord:
      type: object
      required: [subject, score, reporterCount, updatedAt]
      properties:
        subject: { type: string }
        score: { type: integer, format: int64 }
        reporterCount: { type: integer }
        updatedAt: { type: integer, format: int64 }
    ScoreEntry:
      type: object
      required: [reporter, delta, reason, submittedAt]
      properties:
        reporter: { type: string }
        delta: { type: integer, format: int64 }
        reason: { type: string }
        submittedAt: { type: integer, format: int64 }
    CredentialIdsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { type: string, description: Hex-encoded 32-byte credential ID. }
        nextCursor:
          type: integer
          format: int64
          nullable: true
    AddressesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { type: string }
        nextCursor:
          type: integer
          format: int64
          nullable: true
    ScoreEntriesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScoreEntry' }
        nextCursor:
          type: integer
          format: int64
          nullable: true
    ApiKeyMetadata:
      type: object
      required: [id, name, owner, scopes, tier, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string }
        keyPrefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        tier:
          type: string
          enum: [free, pro, enterprise]
        status:
          type: string
          enum: [active, revoked]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
    IssuedApiKey:
      allOf:
        - $ref: '#/components/schemas/ApiKeyMetadata'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              description: Plaintext secret key returned once at issuance.
